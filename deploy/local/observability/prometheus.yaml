global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
      vhost: [/]
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: container-status
    static_configs:
      - targets: [docker-status-exporter:9927]
