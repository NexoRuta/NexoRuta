receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource/node:
    attributes:
      - key: node
        value: local
        action: upsert
  batch: {}

exporters:
  otlp/aspire:
    endpoint: dashboard:18889
    tls:
      insecure: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_constant_labels:
      included:
        - service.name
        - node

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/node, batch]
      exporters: [otlp/aspire, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [resource/node, batch]
      exporters: [otlp/aspire, prometheus]
