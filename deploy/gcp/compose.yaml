name: nexoruta-demo
x-api-env: &id001
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Postgres: ${API_CONNECTION:?}
  MongoDB__ConnectionString: mongodb://nexoruta_api:${MONGO_API_PASSWORD:?}@${SERVICES_HOST:?}:27017/nexoruta?authSource=nexoruta
  MongoDB__Database: nexoruta
  ConnectionStrings__Redis: ${REDIS_HOST:?}:${REDIS_PORT:?},ssl=true,sslHost=${REDIS_HOST:?},abortConnect=false,connectRetry=1,connectTimeout=1000,syncTimeout=500,asyncTimeout=500,keepAlive=30
  Caching__Enabled: ${NEXORUTA_CACHE_ENABLED:?}
  Caching__Namespace: nexoruta-gcp-demo
  Caching__OperationTimeoutMilliseconds: '500'
  Caching__MaxEntryBytes: '2097152'
  Caching__RedisTls: 'true'
  Caching__RedisCaCertificatesBase64Json: ${REDIS_CA_CERTIFICATES_BASE64_JSON:?}
  Caching__RedisPassword: ${REDIS_AUTH:-}
  Caching__OperatorBranding__TtlSeconds: '900'
  Caching__PublishedTariff__TtlSeconds: '21600'
  Jwt__SigningKeyBase64: ${JWT_KEY:?}
  DatabaseInitialization__ApplyMigrations: 'false'
  DatabaseInitialization__SeedData: 'false'
  Email__Smtp__Host: ${SMTP_HOST:?}
  Email__Smtp__Port: ${SMTP_PORT:?}
  Email__Smtp__UseSsl: ${SMTP_SSL:?}
  Email__Smtp__Username: ${SMTP_USERNAME:-}
  Email__Smtp__Password: ${SMTP_PASSWORD:-}
  Email__Smtp__FromAddress: ${SMTP_FROM:?}
  PasswordRecovery__ResetPageUrl: ${COMMERCE_URL:?}/restablecer-contrasena
  Tracking__PublicBaseUrl: ${TRACKING_URL:?}
  Seguimiento__EncryptionKey: ${TRACKING_KEY:?}
  Push__RegistrationEncryptionKey: ${PUSH_KEY:?}
  Reparto__EvidenciasEncryptionKey: ${EVIDENCE_KEY:?}
  Geocoding__Geoapify__ApiKey: ${GEOAPIFY_API_KEY:-}
  OpenTelemetry__Enabled: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  NODE_NAME: ${NODE_NAME:?}
  RELEASE_ID: ${RELEASE_ID:?}
  Logging__LogLevel__Microsoft.AspNetCore: Warning
  Logging__LogLevel__System.Net.Http.HttpClient: Warning
  ConnectionStrings__DataProtection: ${KEYS_API_CONNECTION:?}
  DataProtection__CertificatePath: /data/hosting.pfx
  DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
  Hosting__BehindLoadBalancer: 'true'
  Hosting__TrustedNetworks: ${TRUSTED_NETWORKS:?}
  AllowedHosts: ${ALLOWED_HOSTS:?}
  ConnectionStrings__RateLimits: ${API_CONNECTION:?}
x-worker:
  image: ${WORKER_IMAGE:?}
  entrypoint: &id002
  - dotnet
  - NexoRuta.Worker.dll
  restart: unless-stopped
  mem_limit: 768m
  cpu_shares: 256
  stop_grace_period: 30s
  environment: &id003
    DOTNET_ENVIRONMENT: Production
    ConnectionStrings__Postgres: ${WORKER_CONNECTION:?}
    Messaging__Transport: RabbitMq
    RabbitMq__Host: ${SERVICES_HOST:?}
    RabbitMq__Username: nexoruta
    RabbitMq__Password: ${RABBIT_PASSWORD:?}
    Seguimiento__EncryptionKey: ${TRACKING_KEY:?}
    Tracking__PublicBaseUrl: ${TRACKING_URL:?}
    Push__RegistrationEncryptionKey: ${PUSH_KEY:?}
    Push__ProjectId: ${PROJECT_ID:?}
    Email__Smtp__Host: ${SMTP_HOST:?}
    Email__Smtp__Port: ${SMTP_PORT:?}
    Email__Smtp__UseSsl: ${SMTP_SSL:?}
    Email__Smtp__Username: ${SMTP_USERNAME:-}
    Email__Smtp__Password: ${SMTP_PASSWORD:-}
    Email__Smtp__FromAddress: ${SMTP_FROM:?}
    OpenTelemetry__Enabled: 'true'
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    NODE_NAME: ${NODE_NAME:?}
    RELEASE_ID: ${RELEASE_ID:?}
    Logging__LogLevel__Microsoft.AspNetCore: Warning
    Logging__LogLevel__System.Net.Http.HttpClient: Warning
    ConnectionStrings__DataProtection: ${KEYS_API_CONNECTION:?}
    DataProtection__CertificatePath: /data/hosting.pfx
    DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
  volumes: &id004
  - ./hosting.pfx:/data/hosting.pfx:ro
  healthcheck: &id005
    test:
    - CMD-SHELL
    - kill -0 1
    interval: 15s
    timeout: 3s
    retries: 4
x-web:
  restart: unless-stopped
  mem_limit: 768m
  cpu_shares: 1024
  stop_grace_period: 30s
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    Api__BaseAddress: ${API_URL:?}/
    OpenTelemetry__Enabled: 'true'
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    NODE_NAME: ${NODE_NAME:?}
    RELEASE_ID: ${RELEASE_ID:?}
    Logging__LogLevel__Microsoft.AspNetCore: Warning
    Logging__LogLevel__System.Net.Http.HttpClient: Warning
    ConnectionStrings__DataProtection: ${KEYS_TRACKING_CONNECTION:?}
    DataProtection__CertificatePath: /data/hosting.pfx
    DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
    Hosting__BehindLoadBalancer: 'true'
    Hosting__TrustedNetworks: ${TRUSTED_NETWORKS:?}
    AllowedHosts: ${ALLOWED_HOSTS:?}
  healthcheck: &id006
    test:
    - CMD-SHELL
    - curl -fsS http://localhost:8080/health/ready >/dev/null
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s
services:
  sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.0
    command:
    - --private-ip
    - --address=0.0.0.0
    - --port=5432
    - --structured-logs
    - ${SQL_CONNECTION_NAME:?}
    restart: unless-stopped
    mem_limit: 256m
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nexoruta
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?}
    volumes:
    - rabbit:/var/lib/rabbitmq
    - ./monitoring/rabbit-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    mem_limit: 768m
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 20
    profiles:
    - shared
    ports:
    - ${NODE_PRIVATE_IP:?}:5672:5672
    - ${NODE_PRIVATE_IP:?}:15692:15692
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${SERVICES_HOST:?}:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '24'
      KAFKA_LOG_RETENTION_BYTES: '1073741824'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
      CLUSTER_ID: mN63dY3RQWeNexoRutaDemoQ
    volumes:
    - kafka:/var/lib/kafka/data
    mem_limit: 1536m
    cpu_shares: 512
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null
      interval: 15s
      timeout: 15s
      retries: 20
    profiles:
    - shared
    ports:
    - ${NODE_PRIVATE_IP:?}:19092:19092
  mongo:
    image: mongo:8.0
    command:
    - mongod
    - --wiredTigerCacheSizeGB
    - '0.25'
    - --bind_ip_all
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexoruta
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
    - mongo:/data/db
    mem_limit: 768m
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --eval ''quit(db.adminCommand({ping:1}).ok ? 0 : 1)'' >/dev/null'
      interval: 10s
      timeout: 10s
      retries: 20
    profiles:
    - shared
    ports:
    - ${NODE_PRIVATE_IP:?}:27017:27017
  mongo-provisioner:
    image: mongo:8.0
    entrypoint:
    - mongosh
    - --quiet
    - --host
    - mongo
    - --file
    - /opt/nexoruta/create-operational-users.js
    environment:
      MONGO_ROOT_USERNAME: nexoruta
      MONGO_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
      MONGO_API_PASSWORD: ${MONGO_API_PASSWORD:?}
      MONGO_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD:?}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
    - ./mongo/create-operational-users.js:/opt/nexoruta/create-operational-users.js:ro
    mem_limit: 512m
    profiles:
    - shared
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '500'
    mem_limit: 128m
    profiles:
    - shared
    ports:
    - ${NODE_PRIVATE_IP:?}:1025:1025
  redis:
    image: redis:7.2.16-alpine3.21@sha256:f2c5eb3d970536f4bd6538875f650cc8482284fc828d7de20fd25a5f16fa7fdc
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    user: "999:1000"
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 20s
    environment:
      REDIS_HOST: ${REDIS_HOST:?}
      REDIS_CONFIG_FINGERPRINT: ${REDIS_CONFIG_FINGERPRINT:?}
    volumes:
    - ${REDIS_CONFIG_DIR:?}/redis.conf:/usr/local/etc/redis/redis.conf:ro
    - ${REDIS_CONFIG_DIR:?}/ca.crt:/run/redis/ca.crt:ro
    - ${REDIS_CONFIG_DIR:?}/server.crt:/run/redis/server.crt:ro
    - ${REDIS_CONFIG_DIR:?}/server.key:/run/redis/server.key:ro
    - ${REDIS_CONFIG_DIR:?}/users.acl:/run/redis/users.acl:ro
    - ${REDIS_CONFIG_DIR:?}/redis-auth:/run/redis/redis-auth:ro
    tmpfs:
    - /data:rw,noexec,nosuid,size=16m,uid=999,gid=1000,mode=0750
    - /tmp:rw,noexec,nosuid,size=8m,uid=999,gid=1000,mode=0700
    ports:
    - ${NODE_PRIVATE_IP:?}:6378:6378
    healthcheck:
      test:
      - CMD-SHELL
      - 'REDISCLI_AUTH="$$(cat /run/redis/redis-auth)" redis-cli --tls --cacert /run/redis/ca.crt --sni "$$REDIS_HOST" -h "$$REDIS_HOST" -p 6378 PING | grep -qx PONG'
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    profiles:
    - cache-b
  db-tools:
    image: postgres:18-alpine
    environment:
      PGHOST: sql-proxy
      PGDATABASE: nexoruta
      PGUSER: postgres
      PGPASSWORD: ${MIGRATOR_PASSWORD:?}
      NEXORUTA_API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      NEXORUTA_WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?}
      NEXORUTA_BOOTSTRAP_DB_PASSWORD: ${BOOTSTRAP_DB_PASSWORD:?}
      KEYS_API_PASSWORD: ${KEYS_API_PASSWORD:?}
      KEYS_ADMIN_PASSWORD: ${KEYS_ADMIN_PASSWORD:?}
      KEYS_BACKOFFICE_PASSWORD: ${KEYS_BACKOFFICE_PASSWORD:?}
      KEYS_COMMERCE_PASSWORD: ${KEYS_COMMERCE_PASSWORD:?}
      KEYS_TRACKING_PASSWORD: ${KEYS_TRACKING_PASSWORD:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
    volumes:
    - ./sql:/deploy/sql:ro
    profiles:
    - administration
  migrate:
    image: ${API_IMAGE:?}
    command:
    - database-migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
      ConnectionStrings__Postgres: ${MIGRATOR_CONNECTION:?}
      Jwt__SigningKeyBase64: ${JWT_KEY:?}
      DatabaseInitialization__ApplyMigrations: 'false'
      DatabaseInitialization__SeedData: 'false'
      Email__Smtp__Host: ${SMTP_HOST:?}
      Email__Smtp__Port: ${SMTP_PORT:?}
      Email__Smtp__UseSsl: ${SMTP_SSL:?}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM:?}
      PasswordRecovery__ResetPageUrl: ${COMMERCE_URL:?}/restablecer-contrasena
      Tracking__PublicBaseUrl: ${TRACKING_URL:?}
      Seguimiento__EncryptionKey: ${TRACKING_KEY:?}
      Push__RegistrationEncryptionKey: ${PUSH_KEY:?}
      Reparto__EvidenciasEncryptionKey: ${EVIDENCE_KEY:?}
      Geocoding__Geoapify__ApiKey: ${GEOAPIFY_API_KEY:-}
      OpenTelemetry__Enabled: 'false'
      ConnectionStrings__DataProtection: ${KEYS_API_CONNECTION:?}
      DataProtection__CertificatePath: /data/hosting.pfx
      DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
    volumes:
    - ./hosting.pfx:/data/hosting.pfx:ro
    profiles:
    - administration
  bootstrap:
    image: ${API_IMAGE:?}
    command:
    - local-bootstrap
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
      ConnectionStrings__Postgres: ${BOOTSTRAP_CONNECTION:?}
      Jwt__SigningKeyBase64: ${JWT_KEY:?}
      DatabaseInitialization__ApplyMigrations: 'false'
      DatabaseInitialization__SeedData: 'false'
      Email__Smtp__Host: ${SMTP_HOST:?}
      Email__Smtp__Port: ${SMTP_PORT:?}
      Email__Smtp__UseSsl: ${SMTP_SSL:?}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM:?}
      PasswordRecovery__ResetPageUrl: ${COMMERCE_URL:?}/restablecer-contrasena
      Tracking__PublicBaseUrl: ${TRACKING_URL:?}
      Seguimiento__EncryptionKey: ${TRACKING_KEY:?}
      Push__RegistrationEncryptionKey: ${PUSH_KEY:?}
      Reparto__EvidenciasEncryptionKey: ${EVIDENCE_KEY:?}
      Geocoding__Geoapify__ApiKey: ${GEOAPIFY_API_KEY:-}
      OpenTelemetry__Enabled: 'false'
      ConnectionStrings__DataProtection: ${KEYS_API_CONNECTION:?}
      DataProtection__CertificatePath: /data/hosting.pfx
      DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
    volumes:
    - ./bootstrap.json:/app/appsettings.Production.json:ro
    - ./hosting.pfx:/data/hosting.pfx:ro
    profiles:
    - administration
  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment: *id001
    volumes:
    - ./hosting.pfx:/data/hosting.pfx:ro
    mem_limit: 1536m
    cpu_shares: 2048
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    ports:
    - ${NODE_PRIVATE_IP:?}:18080:8080
  worker-rabbit:
    image: ${WORKER_IMAGE:?}
    entrypoint: *id002
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 256
    stop_grace_period: 30s
    environment: *id003
    volumes: *id004
    healthcheck: *id005
  worker-kafka:
    image: ${WORKER_IMAGE:?}
    entrypoint: *id002
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 256
    stop_grace_period: 30s
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: ${WORKER_CONNECTION:?}
      Messaging__Transport: Kafka
      RabbitMq__Host: ${SERVICES_HOST:?}
      RabbitMq__Username: nexoruta
      RabbitMq__Password: ${RABBIT_PASSWORD:?}
      Seguimiento__EncryptionKey: ${TRACKING_KEY:?}
      Tracking__PublicBaseUrl: ${TRACKING_URL:?}
      Push__RegistrationEncryptionKey: ${PUSH_KEY:?}
      Push__ProjectId: ${PROJECT_ID:?}
      Email__Smtp__Host: ${SMTP_HOST:?}
      Email__Smtp__Port: ${SMTP_PORT:?}
      Email__Smtp__UseSsl: ${SMTP_SSL:?}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM:?}
      Kafka__BootstrapServers: ${SERVICES_HOST:?}:19092
      Kafka__SecurityProtocol: Plaintext
      MongoDb__ConnectionString: mongodb://nexoruta_worker:${MONGO_WORKER_PASSWORD:?}@${SERVICES_HOST:?}:27017/nexoruta?authSource=nexoruta
      MongoDb__Database: nexoruta
      MongoDb__PasswordRecoveryCollection: PasswordRecoveryRequested
      OpenTelemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      NODE_NAME: ${NODE_NAME:?}
      RELEASE_ID: ${RELEASE_ID:?}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes: *id004
    healthcheck: *id005
  worker-push:
    image: ${WORKER_IMAGE:?}
    entrypoint: *id002
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 256
    stop_grace_period: 30s
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: ${WORKER_CONNECTION:?}
      Messaging__Transport: Push
      RabbitMq__Host: ${SERVICES_HOST:?}
      RabbitMq__Username: nexoruta
      RabbitMq__Password: ${RABBIT_PASSWORD:?}
      Seguimiento__EncryptionKey: ${TRACKING_KEY:?}
      Tracking__PublicBaseUrl: ${TRACKING_URL:?}
      Push__RegistrationEncryptionKey: ${PUSH_KEY:?}
      Push__ProjectId: ${PROJECT_ID:?}
      Email__Smtp__Host: ${SMTP_HOST:?}
      Email__Smtp__Port: ${SMTP_PORT:?}
      Email__Smtp__UseSsl: ${SMTP_SSL:?}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM:?}
      OpenTelemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      NODE_NAME: ${NODE_NAME:?}
      RELEASE_ID: ${RELEASE_ID:?}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes: *id004
    healthcheck: *id005
  admin:
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 1024
    stop_grace_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseAddress: ${API_URL:?}/
      OpenTelemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      NODE_NAME: ${NODE_NAME:?}
      RELEASE_ID: ${RELEASE_ID:?}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      ConnectionStrings__DataProtection: ${KEYS_ADMIN_CONNECTION:?}
      DataProtection__CertificatePath: /data/hosting.pfx
      DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
      Hosting__BehindLoadBalancer: 'true'
      Hosting__TrustedNetworks: ${TRUSTED_NETWORKS:?}
      AllowedHosts: ${ALLOWED_HOSTS:?}
    healthcheck: *id006
    image: ${ADMIN_IMAGE:?}
    volumes:
    - ./hosting.pfx:/data/hosting.pfx:ro
    ports:
    - ${NODE_PRIVATE_IP:?}:18081:8080
  backoffice:
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 1024
    stop_grace_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseAddress: ${API_URL:?}/
      OpenTelemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      NODE_NAME: ${NODE_NAME:?}
      RELEASE_ID: ${RELEASE_ID:?}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      ConnectionStrings__DataProtection: ${KEYS_BACKOFFICE_CONNECTION:?}
      DataProtection__CertificatePath: /data/hosting.pfx
      DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
      Hosting__BehindLoadBalancer: 'true'
      Hosting__TrustedNetworks: ${TRUSTED_NETWORKS:?}
      AllowedHosts: ${ALLOWED_HOSTS:?}
    healthcheck: *id006
    image: ${BACKOFFICE_IMAGE:?}
    volumes:
    - ./hosting.pfx:/data/hosting.pfx:ro
    ports:
    - ${NODE_PRIVATE_IP:?}:18082:8080
  commerce:
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 1024
    stop_grace_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseAddress: ${API_URL:?}/
      OpenTelemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      NODE_NAME: ${NODE_NAME:?}
      RELEASE_ID: ${RELEASE_ID:?}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      ConnectionStrings__DataProtection: ${KEYS_COMMERCE_CONNECTION:?}
      DataProtection__CertificatePath: /data/hosting.pfx
      DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
      Hosting__BehindLoadBalancer: 'true'
      Hosting__TrustedNetworks: ${TRUSTED_NETWORKS:?}
      AllowedHosts: ${ALLOWED_HOSTS:?}
    healthcheck: *id006
    image: ${COMMERCE_IMAGE:?}
    volumes:
    - ./hosting.pfx:/data/hosting.pfx:ro
    ports:
    - ${NODE_PRIVATE_IP:?}:18083:8080
  tracking:
    restart: unless-stopped
    mem_limit: 768m
    cpu_shares: 1024
    stop_grace_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseAddress: ${API_URL:?}/
      OpenTelemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      NODE_NAME: ${NODE_NAME:?}
      RELEASE_ID: ${RELEASE_ID:?}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
      ConnectionStrings__DataProtection: ${KEYS_TRACKING_CONNECTION:?}
      DataProtection__CertificatePath: /data/hosting.pfx
      DataProtection__CertificatePassword: ${HOSTING_CERT_PASSWORD:?}
      Hosting__BehindLoadBalancer: 'true'
      Hosting__TrustedNetworks: ${TRUSTED_NETWORKS:?}
      AllowedHosts: ${ALLOWED_HOSTS:?}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 18
    image: ${TRACKING_IMAGE:?}
    volumes:
    - ./hosting.pfx:/data/hosting.pfx:ro
    ports:
    - ${NODE_PRIVATE_IP:?}:18084:8080
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
    - ${NODE_PRIVATE_IP:?}:18025:8025
    environment:
      MAIL_PASSWORD_HASH: ${MAIL_PASSWORD_HASH:?}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    mem_limit: 256m
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:2019/config/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
    profiles:
    - shared
  prometheus:
    image: prom/prometheus:v3.15.1
    user: "0:0"
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=4GB
    - --web.enable-remote-write-receiver
    restart: unless-stopped
    # Recovery of the persisted WAL/WBL exceeds 2 GiB on VM A.
    mem_limit: 4g
    ports:
    - ${NODE_PRIVATE_IP:?}:9090:9090
    volumes:
    - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    - prometheus:/prometheus
    profiles:
    - shared
  prometheus-write-gateway:
    image: python:3.13-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    command: [python3, /etc/nexoruta/prometheus-write-gateway.py]
    ports:
    - ${NODE_PRIVATE_IP:?}:9091:9091
    volumes:
    - ./monitoring/prometheus-write-gateway.py:/etc/nexoruta/prometheus-write-gateway.py:ro
    depends_on:
      prometheus:
        condition: service_started
    profiles:
    - shared
  gcp-metrics-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PROJECT_ID: ${PROJECT_ID:?}
    volumes:
    - ./monitoring/gcp-metrics-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_started
    profiles:
    - shared
  loki:
    image: grafana/loki:3.7.9
    command: ["--config.file=/etc/loki/config.yaml"]
    restart: unless-stopped
    mem_limit: 384m
    ports:
    - ${NODE_PRIVATE_IP:?}:3100:3100
    volumes:
    - ./monitoring/loki.yaml:/etc/loki/config.yaml:ro
    - loki:/loki
    profiles:
    - shared
  tempo:
    image: grafana/tempo:3.1.1
    command: ["--config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    mem_limit: 256m
    ports:
    - ${NODE_PRIVATE_IP:?}:3200:3200
    - ${NODE_PRIVATE_IP:?}:4317:4317
    volumes:
    - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - tempo:/var/tempo
    profiles:
    - shared
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    user: "0:0"
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 300MiB
      NODE_NAME: ${NODE_NAME:?}
      SERVICES_HOST: ${SERVICES_HOST:?}
    volumes:
    - ./monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    - otelcol:/var/lib/otelcol
  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    restart: unless-stopped
    user: "0:0"
    mem_limit: 128m
    environment:
      NODE_NAME: ${NODE_NAME:?}
      SERVICES_HOST: ${SERVICES_HOST:?}
    volumes:
    - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - alloy:/var/lib/alloy/data
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    mem_limit: 512m
    ports:
    - ${NODE_PRIVATE_IP:?}:13000:3000
    environment:
      GCP_PROJECT_ID: ${PROJECT_ID:?}
      SERVICES_HOST: ${SERVICES_HOST:?}
      GF_SERVER_ROOT_URL: ${MONITOR_URL:?}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: sql-proxy:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: nexoruta_grafana_runtime
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_GOOGLE_ENABLED: 'true'
      GF_AUTH_GOOGLE_CLIENT_ID: ${MONITOR_GOOGLE_CLIENT_ID:?}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${MONITOR_GOOGLE_CLIENT_SECRET:?}
      GF_AUTH_GOOGLE_SCOPES: openid email profile
      GF_AUTH_GOOGLE_USE_PKCE: 'true'
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH: ${MONITOR_ROLE_EXPRESSION:?}
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_STRICT: 'true'
      GF_AUTH_GOOGLE_SKIP_ORG_ROLE_SYNC: 'false'
      GF_AUTH_GOOGLE_ALLOW_ASSIGN_GRAFANA_ADMIN: 'false'
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 24
volumes:
  rabbit: null
  kafka: null
  mongo: null
  caddy-data: null
  caddy-config: null
  prometheus: null
  loki: null
  tempo: null
  otelcol: null
  alloy: null
