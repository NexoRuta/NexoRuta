bind 0.0.0.0
protected-mode yes
port 0
tls-port 6378
tls-cert-file /run/redis/server.crt
tls-key-file /run/redis/server.key
tls-ca-cert-file /run/redis/ca.crt
tls-auth-clients no
daemonize no
supervised no
pidfile /tmp/redis-server.pid
logfile ""
databases 1
save ""
appendonly no
dir /data
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-clients 64mb
maxclients 128
tcp-backlog 128
tcp-keepalive 30
timeout 0
aclfile /run/redis/users.acl
