global:
  scrape_interval: 30s
  evaluation_interval: 30s

storage:
  tsdb:
    out_of_order_time_window: 6h

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: gcp-cloud-metrics
    scrape_interval: 60s
    static_configs:
      - targets: [gcp-metrics-collector:9464]
