global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: gcp-cloud-metrics
    scrape_interval: 60s
    static_configs:
      - targets: [gcp-metrics-collector:9464]
