receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  filter/drop_stale_metrics:
    error_mode: ignore
    metric_conditions:
      - datapoint.time_unix_nano < UnixNano(Now()) - Nanoseconds(Duration("5m"))
  resource/node:
    attributes:
      - key: node
        value: ${env:NODE_NAME}
        action: upsert
  batch: {}

exporters:
  prometheus_remote_write:
    http:
      endpoint: http://${env:SERVICES_HOST}:9090/api/v1/write
      tls:
        insecure: true
    resource_constant_labels:
      included: [service.name, service.instance.id, node]
    wal:
      directory: /var/lib/otelcol/prometheusremotewrite
    retry_on_failure:
      max_elapsed_time: 5m
  otlp/tempo:
    endpoint: ${env:SERVICES_HOST}:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_stale_metrics, resource/node, batch]
      exporters: [prometheus_remote_write]
    traces:
      receivers: [otlp]
      processors: [resource/node, batch]
      exporters: [otlp/tempo]
