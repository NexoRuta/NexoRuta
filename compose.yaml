services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    container_name: nexoruta-postgres
    environment:
      POSTGRES_DB: nexoruta
      POSTGRES_USER: nexoruta
      POSTGRES_PASSWORD: ${NEXORUTA_POSTGRES_PASSWORD:?Set existing development password in .env}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoruta -d nexoruta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    container_name: nexoruta-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4-management
    container_name: nexoruta-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${NEXORUTA_RABBITMQ_USERNAME:?Set existing development user in .env}
      RABBITMQ_DEFAULT_PASS: ${NEXORUTA_RABBITMQ_PASSWORD:?Set existing development password in .env}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: nexoruta-dashboard
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"
      - "127.0.0.1:4318:18890"

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: src/NexoRuta.Api/NexoRuta.Api.csproj
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
        RUNTIME_TOOLS: "true"
    container_name: nexoruta-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${NEXORUTA_POSTGRES_CONNECTION:?Set existing development connection in .env}
      Seguimiento__EncryptionKey: ${NEXORUTA_SEGUIMIENTO_ENCRYPTION_KEY:?Set existing development key in .env}
      Tracking__PublicBaseUrl: http://localhost:5000
      DatabaseInitialization__ApplyMigrations: "${NEXORUTA_APPLY_MIGRATIONS:-false}"
      DatabaseInitialization__SeedData: "${NEXORUTA_SEED_DATA:-false}"
      ConnectionStrings__Redis: redis:6379
      OpenTelemetry__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AccesoInicial__UsuarioPassword: ${NEXORUTA_COMERCIO_PASSWORD:?Falta contraseña del comercio}
      AccesoInicial__OperadorUsuarioPassword: ${NEXORUTA_OPERADOR_PASSWORD:?Falta contraseña del operador}
      Jwt__SigningKeyBase64: ${NEXORUTA_JWT_KEY_BASE64:?Falta clave JWT}
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      dashboard:
        condition: service_started

  worker:
    image: nexoruta-worker:local
    build: &worker-build
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: src/NexoRuta.Worker/NexoRuta.Worker.csproj
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/runtime:10.0
    container_name: nexoruta-worker
    entrypoint: ["dotnet", "NexoRuta.Worker.dll"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      Messaging__Transport: RabbitMq
      ConnectionStrings__Postgres: ${NEXORUTA_POSTGRES_CONNECTION:?Set existing development connection in .env}
      Seguimiento__EncryptionKey: ${NEXORUTA_SEGUIMIENTO_ENCRYPTION_KEY:?Set existing development key in .env}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${NEXORUTA_RABBITMQ_USERNAME:?Set existing development user in .env}
      RabbitMq__Password: ${NEXORUTA_RABBITMQ_PASSWORD:?Set existing development password in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-kafka:
    profiles: ["kafka"]
    image: nexoruta-worker:local
    build: *worker-build
    container_name: nexoruta-worker-kafka
    entrypoint: ["dotnet", "NexoRuta.Worker.dll"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      Messaging__Transport: Kafka
      ConnectionStrings__Postgres: ${NEXORUTA_POSTGRES_CONNECTION:?Set existing development connection in .env}
      Kafka__BootstrapServers: kafka:9092
      Kafka__SecurityProtocol: Plaintext
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.9.10
    container_name: nexoruta-kafka
    restart: unless-stopped
    environment:
      # Public, stable local cluster identity, NOT an encryption key.
      CLUSTER_ID: ${NEXORUTA_KAFKA_CLUSTER_ID:-TkVYT1JVVEFfTE9DQUxfMQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.9.10
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic nexoruta.envios.creados.v1 --partitions 3 --replication-factor 1
        --config min.insync.replicas=1 --config retention.ms=604800000

  backoffice:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Backoffice
    container_name: nexoruta-backoffice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
    ports:
      - "5101:8080"
    depends_on:
      api:
        condition: service_healthy

  commerce:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Commerce
    container_name: nexoruta-commerce
    entrypoint: ["dotnet", "NexoRuta.Commerce.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
      Tracking__BaseAddress: http://localhost:5103/
    ports:
      - "5102:8080"
    depends_on:
      api:
        condition: service_healthy

  tracking:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Tracking
    container_name: nexoruta-tracking
    entrypoint: ["dotnet", "NexoRuta.Tracking.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
    ports:
      - "5103:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
