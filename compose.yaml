# Public deployment settings. Credentials remain in GitHub environment secrets.
x-app-settings:
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SSL: "false"
  SMTP_FROM: demo@nexoruta.test
  MAPBOX_PUBLIC_TOKEN: ""

services:
  postgres:
    restart: unless-stopped
    image: postgis/postgis:18-3.6-alpine
    container_name: nexoruta-postgres
    environment:
      POSTGRES_DB: nexoruta
      POSTGRES_USER: nexoruta
      POSTGRES_PASSWORD: ${NEXORUTA_POSTGRES_PASSWORD:?Set existing development password in .env}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoruta -d nexoruta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    container_name: nexoruta-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4-management
    container_name: nexoruta-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${NEXORUTA_RABBITMQ_USERNAME:?Set existing development user in .env}
      RABBITMQ_DEFAULT_PASS: ${NEXORUTA_RABBITMQ_PASSWORD:?Set existing development password in .env}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: nexoruta-dashboard
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"
      - "127.0.0.1:4318:18890"

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: src/NexoRuta.Api/NexoRuta.Api.csproj
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
        RUNTIME_TOOLS: "true"
    container_name: nexoruta-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nexoruta;Username=nexoruta_api_runtime;Password=${NEXORUTA_API_DB_PASSWORD:?Set the local restricted API role password in .env}"
      Seguimiento__EncryptionKey: ${NEXORUTA_SEGUIMIENTO_ENCRYPTION_KEY:?Set existing development key in .env}
      Tracking__PublicBaseUrl: http://localhost:5000
      PasswordRecovery__ResetPageUrl: http://localhost:5102/restablecer-contrasena
      PasswordRecovery__TokenLifespanSeconds: "900"
      DataProtection__KeysDirectory: /var/nexoruta/data-protection-keys
      DatabaseInitialization__ApplyMigrations: "false"
      DatabaseInitialization__SeedData: "false"
      ConnectionStrings__Redis: redis:6379
      OpenTelemetry__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      Jwt__SigningKeyBase64: ${NEXORUTA_JWT_KEY_BASE64:?Falta clave JWT}
    ports:
      - "5000:8080"
    volumes:
      - api_dataprotection_keys:/var/nexoruta/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      dashboard:
        condition: service_started
      mailpit:
        condition: service_started

  # Development-only SMTP sink. Production uses an explicitly configured SMTP relay.
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  worker:
    image: nexoruta-worker:local
    build: &worker-build
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: src/NexoRuta.Worker/NexoRuta.Worker.csproj
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: nexoruta-worker
    entrypoint: ["dotnet", "NexoRuta.Worker.dll"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      Messaging__Transport: RabbitMq
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nexoruta;Username=nexoruta_worker_runtime;Password=${NEXORUTA_WORKER_DB_PASSWORD:?Set the local restricted worker role password in .env}"
      Seguimiento__EncryptionKey: ${NEXORUTA_SEGUIMIENTO_ENCRYPTION_KEY:?Set existing development key in .env}
      DataProtection__KeysDirectory: /var/nexoruta/data-protection-keys
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${NEXORUTA_RABBITMQ_USERNAME:?Set existing development user in .env}
      RabbitMq__Password: ${NEXORUTA_RABBITMQ_PASSWORD:?Set existing development password in .env}
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__UseSsl: "false"
      Email__Smtp__FromAddress: noreply@nexoruta.local
      Email__Smtp__FromName: NexoRuta
    volumes:
      - api_dataprotection_keys:/var/nexoruta/data-protection-keys:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'NexoRuta.Worker.dll' /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  rls-migrator:
    profiles: ["rls-admin"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: src/NexoRuta.Api/NexoRuta.Api.csproj
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
        RUNTIME_TOOLS: "true"
    container_name: nexoruta-rls-migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${NEXORUTA_POSTGRES_CONNECTION:?Set the local migration connection in .env}
    command: ["database-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  rls-role-provisioner:
    profiles: ["rls-admin"]
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: nexoruta
      PGUSER: nexoruta
      PGPASSWORD: ${NEXORUTA_POSTGRES_PASSWORD:?Set existing development password in .env}
      NEXORUTA_API_DB_PASSWORD: ${NEXORUTA_API_DB_PASSWORD:?Set the local restricted API role password in .env}
      NEXORUTA_WORKER_DB_PASSWORD: ${NEXORUTA_WORKER_DB_PASSWORD:?Set the local restricted worker role password in .env}
      NEXORUTA_BOOTSTRAP_DB_PASSWORD: ${NEXORUTA_BOOTSTRAP_DB_PASSWORD:?Set the local restricted bootstrap role password in .env}
    volumes:
      - ./backend/scripts/provision-rls-runtime-roles.sql:/provision-rls-runtime-roles.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/provision-rls-runtime-roles.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  local-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: src/NexoRuta.Api/NexoRuta.Api.csproj
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
        RUNTIME_TOOLS: "true"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nexoruta;Username=nexoruta_bootstrap_runtime;Password=${NEXORUTA_BOOTSTRAP_DB_PASSWORD:?Set the local restricted bootstrap role password in .env}"
      PlatformInitialization__Enabled: "true"
      PlatformInitialization__Email: ${NEXORUTA_ADMIN_MAIL:?Set local platform mail in .env}
      PlatformInitialization__Password: ${NEXORUTA_ADMIN_PASSWORD:?Set local platform password in .env}
      AccesoInicial__UsuarioEmail: ${NEXORUTA_COMERCIO_MAIL:?Falta NEXORUTA_COMERCIO_MAIL}
      AccesoInicial__UsuarioPassword: ${NEXORUTA_COMERCIO_PASSWORD:?Falta NEXORUTA_COMERCIO_PASSWORD}
      AccesoInicial__OperadorUsuarioEmail: ${NEXORUTA_OPERADOR_MAIL:?Falta NEXORUTA_OPERADOR_MAIL}
      AccesoInicial__OperadorUsuarioPassword: ${NEXORUTA_OPERADOR_PASSWORD:?Falta NEXORUTA_OPERADOR_PASSWORD}
      AccesoInicial__ComercioNombre: "Comercio NexoRuta"
      AccesoInicial__OperadorNombre: "Operador NexoRuta"
      AccesoInicial__ComercioId: "0be3d0f2-1ae2-4dd7-a15b-9fd464031270"
      AccesoInicial__OperadorId: "1b41be96-6f3e-42b9-99d0-f2e9b3c7c52a"
      AccesoInicial__ComercioRolCodigo: propietario_comercio
      AccesoInicial__OperadorRolCodigo: propietario_operador
      Bootstrap__Roles__0__Codigo: propietario_comercio
      Bootstrap__Roles__0__Nombre: Owner
      Bootstrap__Roles__0__ComercioId: "0be3d0f2-1ae2-4dd7-a15b-9fd464031270"
      Bootstrap__Roles__1__Codigo: propietario_operador
      Bootstrap__Roles__1__Nombre: Owner
      Bootstrap__Roles__1__OperadorId: "1b41be96-6f3e-42b9-99d0-f2e9b3c7c52a"
    command: ["local-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  worker-kafka:
    profiles: ["kafka"]
    image: nexoruta-worker:local
    build: *worker-build
    container_name: nexoruta-worker-kafka
    entrypoint: ["dotnet", "NexoRuta.Worker.dll"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      Messaging__Transport: Kafka
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nexoruta;Username=nexoruta_worker_runtime;Password=${NEXORUTA_WORKER_DB_PASSWORD:?Set the local restricted worker role password in .env}"
      Kafka__BootstrapServers: kafka:9092
      Kafka__SecurityProtocol: Plaintext
      MongoDb__ConnectionString: "mongodb://${NEXORUTA_MONGODB_USERNAME:-nexoruta_dev}:${NEXORUTA_MONGODB_PASSWORD:-local-dev-only-change-me}@mongodb:27017/?authSource=admin"
      MongoDb__Database: nexoruta_security
      MongoDb__PasswordRecoveryCollection: password_recovery_requested
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'NexoRuta.Worker.dll' /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

  mongodb:
    profiles: ["kafka"]
    image: mongo:8.0
    container_name: nexoruta-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NEXORUTA_MONGODB_USERNAME:-nexoruta_dev}
      MONGO_INITDB_ROOT_PASSWORD: ${NEXORUTA_MONGODB_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.9.10
    container_name: nexoruta-kafka
    restart: unless-stopped
    environment:
      # Public, stable local cluster identity, NOT an encryption key.
      CLUSTER_ID: ${NEXORUTA_KAFKA_CLUSTER_ID:-TkVYT1JVVEFfTE9DQUxfMQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.9.10
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic nexoruta.envios.creados.v1 --partitions 3 --replication-factor 1
        --config min.insync.replicas=1 --config retention.ms=604800000
        && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic nexoruta.password-recovery.requested.v1 --partitions 1 --replication-factor 1
        --config min.insync.replicas=1 --config retention.ms=2592000000

  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Admin
    container_name: nexoruta-admin
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
    ports:
      - "127.0.0.1:5104:8080"
    depends_on:
      api:
        condition: service_healthy

  backoffice:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Backoffice
    container_name: nexoruta-backoffice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
      Mapbox__PublicAccessToken: "${Mapbox__PublicAccessToken:-}"
      Mapbox__StyleUrl: "${Mapbox__StyleUrl:-}"
    ports:
      - "5101:8080"
    depends_on:
      api:
        condition: service_healthy

  commerce:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Commerce
    container_name: nexoruta-commerce
    entrypoint: ["dotnet", "NexoRuta.Commerce.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
      Portales__BackofficeLoginUrl: http://localhost:5101/ingresar
      Portales__AdminLoginUrl: http://localhost:5104/ingresar
      Tracking__BaseAddress: http://localhost:5103/
    ports:
      - "5102:8080"
    depends_on:
      api:
        condition: service_healthy

  tracking:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PROJECT: NexoRuta.Tracking
    container_name: nexoruta-tracking
    entrypoint: ["dotnet", "NexoRuta.Tracking.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseAddress: http://api:8080/
    ports:
      - "5103:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  api_dataprotection_keys:
  redis_data:
  rabbitmq_data:
  kafka_data:
  mongodb_data:
