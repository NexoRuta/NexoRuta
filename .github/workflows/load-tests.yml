name: NexoRuta - pruebas de carga
run-name: NexoRuta load / ${{ inputs.operation }} / ${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Ejecutar o cancelar una prueba remota
        required: true
        default: run
        type: choice
        options: [run, cancel]
      profile:
        description: Perfil con límites revisados
        required: true
        default: baseline
        type: choice
        options: [smoke, baseline, sync, stress, soak]
      run_id:
        description: ID que muestra el resumen para cancelar una corrida
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'run' && 'nexoruta-gcp-load-run' || format('nexoruta-gcp-load-cancel-{0}', inputs.run_id || 'active') }}
  queue: max

jobs:
  load:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: nexoruta-demo
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
      GCP_DELIVERY_BUCKET: ${{ vars.GCP_DELIVERY_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_LOAD_SERVICE_ACCOUNT: ${{ vars.GCP_LOAD_SERVICE_ACCOUNT }}
      GCP_LOAD_PREPARER_SERVICE_ACCOUNT: ${{ vars.GCP_LOAD_PREPARER_SERVICE_ACCOUNT }}
      GCP_BASE_DOMAIN: ${{ vars.GCP_BASE_DOMAIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: inputs.operation == 'run' || inputs.operation == 'cancel'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_LOAD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: "590.0.0"
      - name: Validate demo settings
        run: python3 scripts/gcp/github_environment.py validate load
      - name: Reserve fixture preparation and load test
        if: inputs.operation == 'run'
        id: reservation
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/gcp/load_tests.py reserve-fixture "$PROFILE"
      - name: Publish preparation run ID
        if: inputs.operation == 'run'
        env:
          RUN_ID: ${{ steps.reservation.outputs.run_id }}
          PROFILE: ${{ inputs.profile }}
        run: |
          {
            echo "## Prueba de carga · preparación de fixture"
            echo
            echo "- Perfil: ${PROFILE}"
            echo "- Corrida: ${RUN_ID}"
            echo "- Para cancelar: operation cancel con este run_id."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: inputs.operation == 'run'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_LOAD_PREPARER_SERVICE_ACCOUNT }}
      - name: Ensure application load fixture
        if: inputs.operation == 'run'
        id: fixture
        env:
          NEXORUTA_LOAD_PREPARATION_RUN_ID: ${{ steps.reservation.outputs.run_id }}
        run: python3 scripts/gcp/prepare_load_fixture.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: inputs.operation == 'run'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_LOAD_SERVICE_ACCOUNT }}
      - name: Pin the prepared fixture and verified release
        if: inputs.operation == 'run'
        id: finalize
        env:
          RUN_ID: ${{ steps.reservation.outputs.run_id }}
          FIXTURE_VERSION: ${{ steps.fixture.outputs.fixture_version }}
        run: python3 scripts/gcp/load_tests.py finalize-fixture "$RUN_ID" "$FIXTURE_VERSION"
      - name: Cancel the identified execution
        if: inputs.operation == 'cancel'
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            python3 scripts/gcp/load_tests.py cancel "$REQUESTED_RUN_ID"
          else
            python3 scripts/gcp/load_tests.py cancel
          fi
      - name: Publish the live Grafana link
        if: inputs.operation == 'run'
        id: live-link
        env:
          RUN_ID: ${{ steps.reservation.outputs.run_id }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [[ -n "${GCP_BASE_DOMAIN}" ]]; then
            monitor="https://monitor.${GCP_BASE_DOMAIN}"
          else
            address="$(gcloud compute addresses describe nexoruta-demo-frontend --global --project "$GCP_PROJECT_ID" --format='value(address)')"
            monitor="https://monitor.$(tr '.' '-' <<< "$address" | tr -d '\n').sslip.io"
          fi
          grafana="${monitor}/d/nexoruta-load-tests?from=now-2h&to=now&var-run_id=${RUN_ID}"
          echo "monitor_url=${monitor}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Grafana load test::${grafana}"
          {
            echo "## Prueba de carga · preparación"
            echo
            echo "- Perfil: ${PROFILE}"
            echo "- Corrida: ${RUN_ID}"
            echo "- Grafana en vivo: ${grafana}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the immutable k6 runner image
        if: inputs.operation == 'run'
        id: image
        env:
          PROFILE: ${{ inputs.profile }}
          FIXTURE_VERSION: ${{ steps.finalize.outputs.fixture_version }}
        run: |
          image="$(python3 scripts/gcp/load_image.py)"
          gcloud run jobs update nexoruta-load-tests --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$image" \
            --update-secrets="NEXORUTA_LOAD_FIXTURE=nexoruta-load-fixtures:${FIXTURE_VERSION}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Start one bounded load-test execution
        if: inputs.operation == 'run'
        id: execution
        env:
          PROFILE: ${{ inputs.profile }}
          RUN_ID: ${{ steps.reservation.outputs.run_id }}
          NEXORUTA_FIXTURE_VERSION: ${{ steps.finalize.outputs.fixture_version }}
          NEXORUTA_LOAD_IMAGE: ${{ steps.image.outputs.image }}
        run: python3 scripts/gcp/load_tests.py run "$PROFILE" "$RUN_ID"
      - name: Wait for the exact execution and check its result
        if: inputs.operation == 'run'
        env:
          RUN_ID: ${{ steps.execution.outputs.run_id || steps.reservation.outputs.run_id }}
        run: python3 scripts/gcp/load_tests.py wait "$RUN_ID"
      - name: Publish run links
        if: always() && inputs.operation == 'run'
        env:
          RUN_ID: ${{ steps.execution.outputs.run_id || steps.reservation.outputs.run_id }}
          IMAGE: ${{ steps.image.outputs.image }}
          MONITOR_URL: ${{ steps.live-link.outputs.monitor_url }}
        run: |
          monitor="${MONITOR_URL}"
          {
            echo "## Prueba de carga remota"
            echo
            echo "- Perfil: ${{ inputs.profile }}"
            echo "- Corrida: ${RUN_ID:-sin ejecución registrada}"
            echo "- Imagen k6: ${IMAGE:-no construida}"
            if [[ -n "$monitor" && -n "$RUN_ID" ]]; then
              echo "- Grafana: ${monitor}/d/nexoruta-load-tests?from=now-2h&to=now&var-run_id=${RUN_ID}"
            fi
            echo "- Resultados privados: gs://${GCP_PROJECT_ID}-nexoruta-load-results/runs/${RUN_ID}/"
            echo "- Cloud Run: https://console.cloud.google.com/run/jobs/details/${GCP_REGION}/nexoruta-load-tests?project=${GCP_PROJECT_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove this runner's OS Login SSH key
        if: always()
        run: python3 scripts/gcp/ssh_keys.py cleanup
