name: Integrated CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      backend_ref: {type: string, default: ""}
      frontend_ref: {type: string, default: ""}
      mobile_ref: {type: string, default: ""}
    secrets:
      SUBMODULES_TOKEN: {required: false}
    outputs:
      sources:
        description: Immutable commits tested together
        value: ${{ jobs.applications.outputs.sources }}

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: Validate infrastructure and session control
        run: |
          python3 -m unittest discover -s scripts/gcp -p 'test_*.py' -v
          python3 scripts/gcp/github_environment.py load-app-config
          tofu fmt -check -recursive infra/gcp
          for module in bootstrap demo; do
            tofu -chdir="infra/gcp/$module" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="infra/gcp/$module" validate
          done
          bash -n infra/gcp/demo/startup.sh
          python3 scripts/gcp/validate_compose.py
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  applications:
    runs-on: ubuntu-latest
    # PR code uses a separate environment without deployment credentials.
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'nexoruta-demo' || 'nexoruta-ci' }}
    timeout-minutes: 45
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Resolve exact source commits
        id: sources
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          MOBILE_REF: ${{ inputs.mobile_ref }}
        run: |
          if [[ -n "$BACKEND_REF" ]]; then
            python3 scripts/gcp/delivery.py sources
          else
            python3 - <<'PY'
          import json, pathlib, subprocess
          sources = {repo: subprocess.check_output(['git', '-C', repo, 'rev-parse', 'HEAD'], text=True).strip() for repo in ('backend', 'frontend', 'mobile')}
          pathlib.Path('sources.json').write_text(json.dumps(sources))
          PY
          fi
          python3 - <<'PY'
          import json, os, pathlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sources=' + json.dumps(json.loads(pathlib.Path('sources.json').read_text())) + '\n')
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Backend build and tests with isolated containers
        run: |
          dotnet restore backend/NexoRuta.sln
          dotnet build backend/NexoRuta.sln -c Release --no-restore
          dotnet test backend/NexoRuta.sln -c Release --no-build --no-restore
      - name: Frontend build and tests
        run: |
          dotnet restore frontend/NexoRuta.sln
          dotnet build frontend/NexoRuta.sln -c Release --no-restore
          dotnet test frontend/NexoRuta.sln -c Release --no-build --no-restore
      - name: Mobile portable tests
        run: |
          for layer in Core Api Storage Application; do
            dotnet test "mobile/tests/NexoRuta.Mobile.$layer.Tests" -c Release
          done
      - name: Verify migrations with a non-superuser administrator
        run: python3 scripts/gcp/cloudsql_compat.py
